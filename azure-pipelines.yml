name: $(Date:yyyyMMdd)$(Rev:.r)

# Echo is public: GitHub Actions owns automatic source and contract checks.
# Keep this Azure definition manual for future deployment or private integration work.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
- job: echo_clean_core
  displayName: 'Echo / Clean-Room Contract & Test Suite'
  timeoutInMinutes: 15
  variables:
    UV_CACHE_DIR: '$(Pipeline.Workspace)/.cache/uv'
  steps:
  - checkout: self
    path: s/Cyrene-Echo
    persistCredentials: true
    displayName: 'Checkout repository'
  - task: Cache@2
    inputs:
      key: 'uv | "$(Agent.OS)" | "$(Build.Repository.Name)" | Cyrene-Echo/uv.lock'
      restoreKeys: |
        uv | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cache/uv'
    displayName: 'Restore uv dependency cache'

  - bash: |
      set -euo pipefail
      bash tooling/ci/check-boundary.sh
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Echo
    displayName: 'Enforce Echo boundary before dependency install'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Setup Python 3.12'

  - bash: |
      set -euo pipefail
      python -m pip install uv==0.12.3
      python -m json.tool service.json >/dev/null
      uv sync --locked --group dev
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Echo
    displayName: Install locked Echo dependencies

  - bash: |
      set -euo pipefail
      uv run --no-sync ruff check src tests
      uv run --no-sync mypy
      uv run --no-sync pytest -q tests --junitxml=test-results.xml
      uv run --no-sync python - <<'PY'
      from pathlib import Path
      from openapi_spec_validator import validate
      from openapi_spec_validator.readers import read_from_filename
      for path in Path("contracts/product/v1").glob("*openapi.yaml"):
          document, base = read_from_filename(str(path.resolve()))
          validate(document, base_uri=base)
          print("Validated", path.name)
      PY
      uv build --wheel --out-dir "$(Build.ArtifactStagingDirectory)/wheel"
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Echo
    displayName: Product lint, type, unit, contract and OpenAPI checks

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '$(Pipeline.Workspace)/s/Cyrene-Echo/test-results.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

- job: publish_evidence
  displayName: 'Echo / Assemble Evidence'
  dependsOn: echo_clean_core
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - script: |
      mkdir -p ci/evidence
      cat <<EOT > ci/evidence/summary.json
      {
        "suite": "Cyrene-Echo-Baseline",
        "commit": "$(Build.SourceVersion)",
        "pipeline": "$(Build.DefinitionName)",
        "build_id": "$(Build.BuildId)",
        "result": "PASS",
        "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      }
      EOT
    displayName: 'Generate Evidence Ledger'

  - publish: ci/evidence
    artifact: echo-evidence
    displayName: 'Publish Echo Evidence'

- job: boundary_governance
  displayName: 'Governance / Echo Boundary Guard'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
    path: s/Cyrene-Echo
    persistCredentials: true
  - bash: |
      set -euo pipefail
      bash tooling/ci/check-boundary.sh
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Echo
    displayName: 'Reject Platform coupling and closed artifact taxonomy'
