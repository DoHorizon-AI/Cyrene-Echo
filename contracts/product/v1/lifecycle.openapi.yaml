      operationId: list_inputs_api_v1_evaluation_inputs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationInput'
                title: Response List Inputs Api V1 Evaluation Inputs Get
        '404':
          description: Product action rejected (RFC 9457)
