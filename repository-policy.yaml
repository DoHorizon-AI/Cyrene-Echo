schema_version: cyrene.repository-policy.v1
repository:
  logical_name: cyrene-echo
  lifecycle_class: PUBLIC_PRODUCT
  # Clean-root publication target; the live GitHub setting is switched and read back separately.
  visibility: public
  source_owner: Cyrene Evaluation Product Team
  remote_default_branch: develop
  integration_branch: develop
  release_branch: release
  default_branch: develop
ownership:
  owns:
  - Evaluation suites, runs, results, and gate decisions
  - Human annotations and explicitly selected feedback-set exports
  - Replaceable evaluation execution and Exchange judge adapters
  does_not_own:
  - Dataset ingestion, cleaning, and DatasetVersion state
  - Model training and ModelVersion state
  - Model serving and deployment state
  - Generic control-plane and Artifact Plane implementation
build:
  independent: true
  build_systems:
  - pyproject
artifacts:
  package_units:
  - cyrene-echo
  native_binaries: []
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - evaluation
  - full
  standalone_user_product: false
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: github_releases
  deployment: dohorizon_azure
trust:
  public_requires_private: false
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
